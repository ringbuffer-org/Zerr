name: Deploy Doxygen documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "core/include/**"
      - "docs/**"

permissions:
  # Specifying any permissions sets every unlisted scope to `none`, so
  # actions/checkout needs contents: read stated explicitly -- without it the
  # checkout has no repo read scope and the deploy breaks the moment the repo is
  # private or default token permissions tighten.
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen

      - name: Generate documentation
        run: doxygen docs/Doxyfile

      # This step currently FAILS, and that is expected -- Pages is deliberately not
      # enabled for this repository pending the organization owner's approval. See
      # docs/design/github-pages-deployment.md before trying to fix it.
      #
      # `enablement: true` does not rescue it: creating a Pages site requires admin
      # repository permission, and `administration` is not a scope a workflow's
      # `permissions:` block can grant to GITHUB_TOKEN, so the call comes back
      # "Resource not accessible by integration". It is kept only so that no edit is
      # needed here once Pages is switched on out-of-band -- at which point the
      # initial Get succeeds and Create is never reached.
      #
      # Do not read that as a safety net. It cannot switch an existing site's
      # build_type from legacy to workflow either (that PUT needs admin too), so if
      # Pages is enabled as "Deploy from a branch", GitHub's legacy Jekyll builder
      # keeps running and races this job for the same environment -- on 2026-08-24 it
      # won by 16 seconds and published a rendering of the repo root instead of the
      # generated docs. Whoever enables Pages must choose source "GitHub Actions".
      - name: Configure Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
