name: Deploy Doxygen documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "core/include/**"
      - "docs/**"

permissions:
  # Specifying any permissions sets every unlisted scope to `none`, so
  # actions/checkout needs contents: read stated explicitly -- without it the
  # checkout has no repo read scope and the deploy breaks the moment the repo is
  # private or default token permissions tighten.
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen

      - name: Generate documentation
        run: doxygen docs/Doxyfile

      # enablement: true creates the Pages site on first run. The default (false)
      # only *queries* for an existing site, so on a repository where Pages was
      # never turned on the action fails with "Get Pages site failed ... HttpError:
      # Not Found" and every step after it is skipped -- which is exactly what
      # happened the first time this workflow ran on main. Provisioning here keeps
      # the deploy self-contained instead of depending on someone having clicked
      # through repository settings; it uses the `pages: write` scope granted above.
      - name: Configure Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
