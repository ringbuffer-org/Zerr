name: CI

# One run = one commit = one consistent set of artifacts.
#
# This replaces a pair of workflows chained with `workflow_run`. That chaining was
# not merely awkward, it was wrong: `workflow_run` checks out the *default branch*
# rather than the ref that triggered it, while downloading the core artifact from
# the triggering run. Dispatching the core build on a feature branch therefore made
# the PureData workflow link old main sources against a new libzerr_core.a, which
# failed with an undefined reference that looked like a real defect and was not.
#
# Here every wrapper job takes its core artifact from its own run via `needs:`, so
# a cross-commit mix is not representable rather than merely unlikely.

on:
  pull_request:
  push:
    branches:
      - main
    # Release tags are per host: max-v<ver> and pd-v<ver>. A tag push runs the
    # normal build for that host only and ends in the `release` job below.
    tags:
      - 'max-v*'
      - 'pd-v*'
  workflow_dispatch:

# Jobs only ever read the repository: there is no cross-run artifact download left,
# so nothing here needs a token beyond checkout. State it rather than inherit
# whatever the repository default happens to be, as deploy-doxygen.yml already does.
# The one exception, `release`, raises its own job-level permission to write.
permissions:
  contents: read

# Deliberately no `paths:` filters. A core change must rebuild every wrapper, and
# a wrapper-only change must still build -- the old per-workflow filters are why a
# puredata/- or maxmsp/-only change used to trigger nothing at all. The extra
# minutes are paid back by the conan cache and by cancelling superseded runs.
#
# Superseding is right for a branch, wrong for main: two merges in quick succession
# would cancel the first one's run, and that commit would never get the artifact set
# the header above promises. Only cancel outside main. A release tag makes the same
# promise (its run produces the release assets), so it is never cancelled either.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}

jobs:
  # Artifacts are keyed by TOOLCHAIN, not by platform. Windows needs two distinct
  # core builds -- MinGW for PureData, and later MSVC/static-CRT for Max/MSP, whose
  # max-pretarget.cmake forces /MT. A single `zerr-core-windows` artifact could
  # never express that, which is the structural reason this file exists.
  #
  # Adding a platform or a compiler is one row here plus one row in the consumer.
  core:
    name: core (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos
            runner: macos-latest
            profile: profiles/macos
          - id: linux
            runner: ubuntu-latest
            profile: profiles/linux
            cxxflags: -fPIC
          - id: windows-mingw
            runner: windows-latest
            profile: profiles/mingw
            mingw: true
            # Without this CMake picks Visual Studio whenever one is installed and
            # compiles with MSVC against the gcc/libstdc++ packages profiles/mingw
            # resolved -- objects that cannot link together.
            cmake_args: -G "MinGW Makefiles"

    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW
        if: matrix.mingw
        uses: egor-tensin/setup-mingw@v3
        with:
          # `platform`, not `arch`. The old workflows passed `arch: x64`, which the
          # action rejects -- run 32314194864 logged "Unexpected input(s) 'arch',
          # valid inputs are ['platform', 'cc', 'version']". The builds were 64-bit
          # only because that is the action's default, never because we asked.
          platform: x64

      - uses: ./.github/actions/setup-deps
        with:
          profile: ${{ matrix.profile }}

      # github.workspace yields a mixed-separator path on Windows
      # (D:\a\Zerr\Zerr/build/...). CMake normalises it -- verified in run
      # 32297202438, which logged `Using Conan toolchain: D:/a/Zerr/Zerr/build/...`.
      - name: Build and install
        shell: bash
        env:
          CXXFLAGS: ${{ matrix.cxxflags }}
        run: |
          cmake -S core -B core/build ${{ matrix.cmake_args }} \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/build/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build --config Release
          cmake --install core/build

      - name: Upload core library
        uses: actions/upload-artifact@v4
        with:
          name: zerr-core-${{ matrix.id }}
          path: core/lib
          if-no-files-found: error
          retention-days: 7

  puredata:
    name: puredata (${{ matrix.id }})
    # `needs` cannot name a single matrix leg, so this waits on all three core legs.
    # Without the `if`, one platform's core failure would *skip* every wrapper job --
    # including puredata (windows-mingw), the only job that can catch core/wrapper
    # API drift at build time. `!cancelled()` runs them anyway: the leg whose core
    # artifact is genuinely missing fails at download, and the others still report.
    # (The wait itself is inherent to matrix-level `needs`; splitting core into
    # per-platform jobs would remove it at the cost of the matrix.)
    #
    # On a release tag only the tagged host builds: a pd-v* tag skips maxmsp and a
    # max-v* tag skips puredata. Branches and main are unaffected.
    needs: core
    if: ${{ !cancelled() && (!startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/pd-v')) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `platform` is the <os>-<arch> suffix of the release zip, the same values
          # build.sh derives from uname (macos-latest runs on Apple Silicon).
          - id: macos
            runner: macos-latest
            profile: profiles/macos
            cflags: -mmacosx-version-min=10.13
            platform: macos-arm64
          - id: linux
            runner: ubuntu-latest
            profile: profiles/linux
            platform: linux-x86_64
          # The only job that can catch core/wrapper API drift at build time.
          # macOS links externals with `-undefined suppress` and Linux permits
          # undefined symbols in a .so, so both happily produce an external that
          # fails at load; a .dll must resolve every symbol at link time.
          - id: windows-mingw
            runner: windows-latest
            profile: profiles/mingw
            mingw: true
            make: mingw32-make
            platform: windows-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up MinGW
        if: matrix.mingw
        uses: egor-tensin/setup-mingw@v3
        with:
          # `platform`, not `arch`. The old workflows passed `arch: x64`, which the
          # action rejects -- run 32314194864 logged "Unexpected input(s) 'arch',
          # valid inputs are ['platform', 'cc', 'version']". The builds were 64-bit
          # only because that is the action's default, never because we asked.
          platform: x64

      # No run-id and no github-token: this resolves to the current run, which is
      # what makes the artifact and the checked-out sources the same commit.
      - name: Download core library
        uses: actions/download-artifact@v4
        with:
          name: zerr-core-${{ matrix.id }}
          path: core/lib

      - name: Install Pure Data (macOS)
        if: matrix.id == 'macos'
        run: brew install --cask pd

      - name: Install Pure Data (Linux)
        if: matrix.id == 'linux'
        run: sudo apt update && sudo apt install -y puredata-dev

      - name: Install Pure Data (Windows)
        if: matrix.id == 'windows-mingw'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "http://msp.ucsd.edu/Software/pd-0.53-2.msw.zip"
          $zip = Join-Path $env:RUNNER_TEMP "Pd.zip"
          $pdDir = Join-Path $env:ProgramFiles "pd"

          Invoke-WebRequest $url -OutFile $zip

          if (Test-Path $pdDir) { Remove-Item $pdDir -Recurse -Force }
          New-Item -ItemType Directory -Path $pdDir | Out-Null

          Expand-Archive -LiteralPath $zip -DestinationPath $pdDir -Force
          Remove-Item $zip -Force

          # flatten nested directory
          $top = Get-ChildItem $pdDir | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          if ($top) {
            Get-ChildItem $top.FullName | Move-Item -Destination $pdDir -Force
            Remove-Item $top.FullName -Recurse -Force
          }

          "PD=$pdDir\bin\pd.com" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: ./.github/actions/setup-deps
        with:
          profile: ${{ matrix.profile }}

      - name: Build and install externals
        shell: bash
        working-directory: puredata
        env:
          cflags: ${{ matrix.cflags }}
        run: |
          ${{ matrix.make || 'make' }}
          ${{ matrix.make || 'make' }} install PDLIBDIR=build

      # The same zip ./build.sh -p puredata produces locally, named after the version
      # in puredata/zerr-meta.pd (same sed line as build.sh pd_version(); keep them
      # identical). cmake's tar is on every runner; Pd externals are plain files, so
      # nothing needs ditto here.
      - name: Zip the Pd package
        shell: bash
        working-directory: puredata/build
        run: |
          version=$(sed -n 's|^#X text [0-9][0-9]* [0-9][0-9]* VERSION \(.*\);|\1|p' ../zerr-meta.pd | head -n 1)
          test -n "$version"
          cmake -E tar cf "zerr-pd-${version}-${{ matrix.platform }}.zip" --format=zip zerr
          ls -l zerr-pd-*.zip

      - name: Upload Pd package
        uses: actions/upload-artifact@v4
        with:
          name: zerr-pd-${{ matrix.id }}
          path: puredata/build/zerr-pd-*.zip
          # Nothing consumes this artifact, so without `error` a wrapper that stopped
          # emitting into puredata/build/zerr would leave the job green and publish
          # nothing. The core job is only incidentally protected by its consumers.
          if-no-files-found: error
          retention-days: 7

  # Max/MSP has never had a CI job on any platform. macOS only for now: Max does
  # not exist on Linux, and Windows needs an MSVC toolchain with static CRT to
  # match max-pretarget.cmake's /MT, which means a profiles/windows-msvc and a
  # second Windows core build. That is a follow-up, tracked in the PR body.
  maxmsp:
    name: maxmsp (${{ matrix.id }})
    needs: core
    if: ${{ !cancelled() && (!startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/max-v')) }}   # see the notes on puredata above
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos
            runner: macos-latest
            profile: profiles/macos

    steps:
      # recursive: min-api carries max-sdk-base as a nested submodule, and the
      # Max headers live there.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download core library
        uses: actions/download-artifact@v4
        with:
          name: zerr-core-${{ matrix.id }}
          path: core/lib

      - uses: ./.github/actions/setup-deps
        with:
          profile: ${{ matrix.profile }}

      - name: Build externals
        shell: bash
        run: |
          cmake -S maxmsp -B maxmsp/build \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/build/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build maxmsp/build --config Release

      # The same assembly ./build.sh -p maxmsp does locally. The ditto zip is what
      # a release attaches; it also survives upload-artifact, which does not keep
      # file permissions and would break the bundles if they were uploaded loose.
      - name: Assemble the Max package
        shell: bash
        run: |
          cmake --install maxmsp/build
          for bundle in maxmsp/dist/Zerr/externals/*.mxo; do
            name=$(basename "$bundle" .mxo)
            codesign --verify --deep --strict "$bundle"
            echo "$name: $(lipo -archs "$bundle/Contents/MacOS/$name")"
          done
          version=$(sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p' maxmsp/package-info.json | head -n 1)
          ( cd maxmsp/dist && ditto -c -k --sequesterRsrc --keepParent Zerr "zerr-max-${version}-macos-arm64.zip" )
          find maxmsp/dist/Zerr -type f | sort
          ls -l maxmsp/dist/*.zip

      - name: Upload Max package
        uses: actions/upload-artifact@v4
        with:
          name: zerr-max-${{ matrix.id }}-arm64
          path: maxmsp/dist/zerr-max-*.zip
          if-no-files-found: error
          retention-days: 7

  # Per-host releases. A tag max-v<ver> or pd-v<ver> ends here: the tagged host's
  # zips (and only those) go onto a DRAFT GitHub release with the notes from
  # docs/releases/<tag>.md pre-filled. Nothing is published by CI; the owner reads
  # the draft and clicks publish. A tag with a suffix (max-v0.3.0-rc1) becomes a
  # prerelease draft, which is the dry-run path.
  #
  # `!cancelled()` is required: one of the two `needs` is always skipped on a tag.
  # The explicit `result == 'success'` checks are what make a Pd tag independent of
  # the Max job and vice versa. `gh release create` refuses an existing release, so
  # a re-run after a failure needs the draft deleted first:
  #   gh release delete <tag> --yes
  release:
    name: release (${{ github.ref_name }})
    needs: [puredata, maxmsp]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') &&
          ((startsWith(github.ref, 'refs/tags/pd-v')  && needs.puredata.result == 'success') ||
           (startsWith(github.ref, 'refs/tags/max-v') && needs.maxmsp.result   == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The tag must say what the host's version file says, suffix aside
      # (max-v0.3.0-rc1 may be cut from a tree whose file says 0.3.0). The two sed
      # lines are the ones in build.sh max_version()/pd_version(); keep them identical.
      - name: Check the tag against the host's version file
        id: guard
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          case "$tag" in
            max-v*) host=max; title="Max";       want="${tag#max-v}"
                    have=$(sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p' maxmsp/package-info.json | head -n 1) ;;
            pd-v*)  host=pd;  title="Pure Data"; want="${tag#pd-v}"
                    have=$(sed -n 's|^#X text [0-9][0-9]* [0-9][0-9]* VERSION \(.*\);|\1|p' puredata/zerr-meta.pd | head -n 1) ;;
            *)      echo "unexpected tag $tag"; exit 1 ;;
          esac
          if [ "${want%%-*}" != "$have" ]; then
            echo "tag $tag says ${want%%-*}, but the version file says $have"
            exit 1
          fi
          { echo "host=$host"; echo "title=$title"; echo "version=$want"; } >> "$GITHUB_OUTPUT"

      # Same run, same commit: see the header. The pattern keeps zerr-core-* out.
      - name: Download the host's packages
        uses: actions/download-artifact@v4
        with:
          pattern: zerr-${{ steps.guard.outputs.host }}-*
          path: assets
          merge-multiple: true

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Zerr* for ${{ steps.guard.outputs.title }} ${{ steps.guard.outputs.version }}
          HOST: ${{ steps.guard.outputs.host }}
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          ls -l assets
          # Notes come from the tag's own file; a suffixed tag (max-v0.3.0-rc1) falls back to
          # the final release's file (max-v0.3.0.md), so a dry run shows the real notes.
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          final="docs/releases/${HOST}-v${VERSION%%-*}.md"
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          elif [ -f "$final" ]; then
            notes_args=(--notes-file "$final")
          else
            notes_args=(--notes "Draft. Write $final and paste it here before publishing.")
          fi
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$TITLE" \
            "${notes_args[@]}" "${pre[@]}" assets/*.zip
          gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,assets \
            --jq '{draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[].name]}'
